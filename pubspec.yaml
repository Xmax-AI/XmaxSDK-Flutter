name: xmax_sdk
description: >-
  Flutter SDK for integrating Xmax AI real-time interactive video generation
  and media storage into iOS and Android apps.
version: 1.1.0
homepage: https://platform.xmaxai.com/
repository: https://github.com/Xmax-AI/XmaxSDK-Flutter
issue_tracker: https://github.com/Xmax-AI/XmaxSDK-Flutter/issues

topics:
  - ai
  - realtime
  - video-generation

platforms:
  android:
  ios:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^11.5.0
  permission_handler: ^12.0.3
  shared_preferences: ^2.5.3
  tencentcloud_cos_sdk_plugin_nobeacon: ^1.2.9
  agora_rtc_engine: 6.6.4

dev_dependencies:
  shared_preferences_platform_interface: ^2.4.2
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: ai.xmax.sdk
        pluginClass: XmaxSDKPlugin
      ios:
        pluginClass: XmaxSDKPlugin
