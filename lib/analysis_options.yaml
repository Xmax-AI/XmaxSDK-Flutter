include: ../analysis_options.yaml

# SDK documentation and formatting:
# - Write concise English comments describing responsibilities and usage contracts.
# - Use /// for Dart and Swift declarations; use multiline Javadoc for Java.
# - Document public and private types, constructors, methods, fields, and callbacks.
# - Describe parameters in declaration order; document useful, nonduplicated results.
# - Keep simple constructor summaries brief instead of repeating field descriptions.
# - Explain meaningful state, units, ownership, cancellation, and failure conditions.
# - Use // for implementation constraints, not history or platform comparisons.
# - Group logical phases and separate documented members with one blank line.
# - Retain a blank line between a type's opening brace and its first member.
# - Put declaration parameters on separate lines, including single parameters.
# - Expand multi-argument calls; retain compact interpolation and scalar calculations.
# - Preserve the standard file header, actual filename, and repository URL.
# - Keep localized strings and log messages unchanged.
# - Maintain SDK whitespace manually; do not run dart format on SDK sources.
# Public coverage is checked below; private coverage is also required in review.

linter:
  rules:
    # SDK documentation coverage applies to lib, not the example app.
    public_member_api_docs: true
    comment_references: true
